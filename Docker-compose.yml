version: "3"

services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

  web:
    build: .

    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      - db
