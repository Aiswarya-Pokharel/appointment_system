<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Appointment</title>

  <style>
    body {
      background: #f4f6fb;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    label {
      font-weight: bold;
      font-size: 14px;
      color: #444;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 5px rgba(13, 110, 253, 0.3);
    }

    button {
      background: #0d6efd;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Edit Appointment</h2>

    <form method="POST">
      {% csrf_token %}

      <label>Name</label>
      <input type="text" name="name" value="{{ data.1 }}">

      <label>Date</label>
      <input type="date" name="date" value="{{ data.2|date:'Y-m-d' }}">

      <label>Time</label>
      <input type="time" name="time" value="{{ data.3|time:'H:i' }}">

      <label>Reason</label>
      <input type="text" name="reason" value="{{ data.4 }}">

      <button type="submit">Update</button>

    </form>

  </div>

</body>

</html>
